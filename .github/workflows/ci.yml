name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Check every module parses
        run: for f in $(find js -name '*.js'); do node --check "$f" || exit 1; done
      - name: Service worker precaches every module
        run: |
          for f in $(find js css -type f); do
            grep -q "\"./$f\"" sw.js || { echo "sw.js SHELL is missing ./$f"; exit 1; }
          done
